name: Build & Deploy

# Builds the Eleventy site and deploys the generated _site/ folder to the
# web host over FTP. Production deploys happen when changes land on `main`.
# You can also trigger a deploy by hand from the Actions tab.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid overlapping deploys clobbering each other.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to host over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./_site/
          server-dir: ${{ vars.FTP_SERVER_DIR || 'public_html/' }}
          # Don't let the deploy touch the image folder you upload manually,
          # or any files that already live on the server outside the build.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
